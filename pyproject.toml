[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Cross-sectional equity alpha research on a point-in-time S&P 500 universe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["reportlab>=4", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
